  - {id: nq_subset_s1,  data: subset, epochs: subset, seed: 1,  flags: *final, intensity_quota: false}
  - {id: nq_subset_s2,  data: subset, epochs: subset, seed: 2,  flags: *final, intensity_quota: false}
  - {id: a_n1_subset,   data: subset, epochs: subset, seed: 42, flags: *n1_only}
  - {id: a_n2_subset,   data: subset, epochs: subset, seed: 42, flags: *n2_only}
  - {id: a_n4_subset,   data: subset, epochs: subset, seed: 42, flags: *n4_only}
  - {id: a_n5_subset,   data: subset, epochs: subset, seed: 42, flags: *n5_only}
  - {id: a_n6_subset,   data: subset, epochs: subset, seed: 42, flags: *n6_only, intensity_quota: false}
